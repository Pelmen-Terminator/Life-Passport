<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Passport V7 — Паспорт жизни</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F3ECDC;
    --bg-body: #F3ECDC;
    --text: #20242B;
    --text-secondary: #5c6570;
    --border: #DED2B2;
    --card-shadow: 0 24px 50px -20px rgba(0,0,0,.35);
    --stamp: #B23A2E;
    --stamp-dark: #8f2d24;
    --gold: #B8923F;
    --gold-soft: #B8923F;
    --stamp-bg: rgba(178,58,46,.07);
    --input-bg: rgba(0,0,0,.05);
    --input-border: #DED2B2;
    --toggle-bg: #DED2B2;
    --toggle-dot: #fff;
    --radius: 14px;
    --warning-bg: #fff3cd;
    --warning-border: #ffc107;
    --warning-text: #856404;
    font-size: 16px;
  }
  [data-theme="dark"]{
    --bg: #1a1a2e;
    --bg-body: #16213e;
    --text: #e8e8e8;
    --text-secondary: #a0a0b0;
    --border: #2a2a4a;
    --card-shadow: 0 24px 50px -20px rgba(0,0,0,.8);
    --stamp: #e8494a;
    --stamp-dark: #ff6b6b;
    --gold: #f0c060;
    --gold-soft: #f0c060;
    --stamp-bg: rgba(232,73,74,.12);
    --input-bg: rgba(255,255,255,.08);
    --input-border: #3a3a5a;
    --toggle-bg: #3a3a5a;
    --toggle-dot: #f0c060;
    --warning-bg: #2d2a1a;
    --warning-border: #ffc107;
    --warning-text: #f0d060;
  }
  *{ box-sizing:border-box; }
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg-body);
    color: var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 16px 48px;
    transition: background .3s, color .3s;
  }
  .wrap{
    width:100%;
    max-width:820px;
    transition: max-width .3s;
  }
  .wrap.phone{ max-width:420px; }
  .wrap.tablet{ max-width:640px; }
  .wrap.computer{ max-width:960px; }
  .wrap.tv{ max-width:1400px; }
  .wrap.car{ max-width:480px; }

  .cover{
    text-align:center;
    padding:4px 8px 16px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    letter-spacing:.28em;
    text-transform:uppercase;
    font-size:.68rem;
    color: var(--gold-soft);
    margin:0 0 10px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:clamp(2rem, 6vw, 2.9rem);
    line-height:1.05;
    margin:0 0 8px;
    letter-spacing:-.01em;
    color: var(--text);
  }
  .sub{
    font-size:.95rem;
    color: var(--text-secondary);
    max-width:480px;
    margin:0 auto;
    line-height:1.5;
  }

  .top-bar{
    display:flex;
    flex-wrap:wrap;
    gap:10px 12px;
    align-items:center;
    justify-content:center;
    margin:16px 0 4px;
  }
  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
  }
  .pillgroup{
    display:inline-flex;
    background: var(--input-bg);
    border:1px solid var(--input-border);
    border-radius:999px;
    padding:3px;
  }
  .pillgroup button{
    font-family:'IBM Plex Mono', monospace;
    font-size:.78rem;
    letter-spacing:.04em;
    border:none;
    background:transparent;
    color: var(--text-secondary);
    padding:6px 14px;
    border-radius:999px;
    cursor:pointer;
    transition:background .2s, color .2s;
  }
  .pillgroup button.active{
    background:var(--gold);
    color:#1c1608;
    font-weight:600;
  }
  select.religion, select.gender, select.age{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:.85rem;
    background: var(--input-bg);
    border:1px solid var(--input-border);
    color: var(--text);
    padding:7px 14px;
    border-radius:999px;
    cursor:pointer;
    appearance:none;
    -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0 L5 6 L10 0' fill='none' stroke='%23b8923f' stroke-width='1.4'/></svg>");
    background-repeat:no-repeat;
    background-position:right 14px center;
    padding-right:32px;
  }
  select option{ background: var(--bg-body); color: var(--text); }

  .settings-toggle{
    background: var(--input-bg);
    border:1px solid var(--input-border);
    border-radius:999px;
    padding:7px 16px;
    color: var(--text);
    font-size:.85rem;
    cursor:pointer;
    font-family:'IBM Plex Sans', sans-serif;
    transition: background .2s;
  }
  .settings-toggle:hover{ background: var(--gold); color:#1c1608; }

  .settings-panel{
    background: var(--bg);
    border:1px solid var(--border);
    border-radius: var(--radius);
    padding:16px 20px;
    margin:10px 0 0;
    display:none;
    grid-template-columns: 1fr 1fr;
    gap:12px 20px;
    box-shadow: var(--card-shadow);
    max-height: 500px;
    overflow-y: auto;
  }
  .settings-panel.open{ display:grid; }
  .settings-panel label{
    font-size:.85rem;
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
  }
  .settings-panel select{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:.85rem;
    background: var(--input-bg);
    border:1px solid var(--input-border);
    color: var(--text);
    padding:5px 12px;
    border-radius:999px;
    cursor:pointer;
    flex:1;
  }
  .settings-panel .cat-toggle-row{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:.85rem;
    padding:4px 0;
    border-bottom:1px solid var(--border);
  }
  .settings-panel .cat-toggle-row .cat-name{
    flex:1;
    font-family:'IBM Plex Mono', monospace;
    font-size:.7rem;
    letter-spacing:.05em;
    text-transform:uppercase;
    color: var(--text-secondary);
  }
  .switch{ position:relative; width:40px; height:22px; flex:0 0 40px; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{
    position:absolute; inset:0;
    background: var(--toggle-bg);
    border-radius:999px;
    cursor:pointer;
    transition:.3s;
  }
  .slider::before{
    content:""; position:absolute; height:16px; width:16px; left:3px; bottom:3px;
    background: var(--toggle-dot);
    border-radius:50%;
    transition:.3s;
  }
  .switch input:checked + .slider{ background: var(--gold); }
  .switch input:checked + .slider::before{ transform:translateX(18px); }

  .note{
    text-align:center;
    font-size:.74rem;
    color: var(--text-secondary);
    max-width:460px;
    margin:8px auto 0;
    line-height:1.5;
  }

  .badge-row{
    display:flex;
    justify-content:center;
    margin:16px 0 22px;
  }
  .badge{
    font-family:'IBM Plex Mono', monospace;
    display:flex;
    align-items:center;
    gap:12px;
    border:1px solid var(--gold);
    border-radius:999px;
    padding:6px 10px 6px 18px;
    background: var(--stamp-bg);
    flex-wrap:wrap;
  }
  .badge .count{ font-size:.95rem; letter-spacing:.03em; color: var(--gold-soft); }
  .badge .bar{
    width:120px; height:6px; border-radius:999px;
    background: rgba(255,255,255,.15);
    overflow:hidden;
  }
  .badge .bar > span{
    display:block; height:100%; background:linear-gradient(90deg, var(--stamp), var(--gold));
    width:0%; transition:width .4s ease;
  }
  .badge .reset{
    font-family:'IBM Plex Mono', monospace;
    font-size:.68rem;
    color: var(--text-secondary);
    background:none; border:1px solid var(--border);
    border-radius:999px; padding:4px 11px; cursor:pointer;
    letter-spacing:.03em;
    transition: border .2s, color .2s;
  }
  .badge .reset:hover{ border-color:var(--stamp); color:var(--stamp); }

  .page{
    background: var(--bg);
    color: var(--text);
    border-radius:var(--radius);
    padding:6px 0 18px;
    box-shadow: var(--card-shadow);
    position:relative;
    overflow-y: auto;
    max-height: 95vh;
    min-height: 500px;
    transition: background .3s, color .3s, max-height .3s;
  }
  .page::-webkit-scrollbar{
    width: 6px;
  }
  .page::-webkit-scrollbar-track{
    background: var(--input-bg);
    border-radius: 10px;
  }
  .page::-webkit-scrollbar-thumb{
    background: var(--gold);
    border-radius: 10px;
  }
  .page::-webkit-scrollbar-thumb:hover{
    background: var(--stamp);
  }

  .page::before{
    content:""; position:absolute; inset:0;
    border-radius:var(--radius);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);
    pointer-events:none;
  }

  .category{
    padding:16px 20px 2px;
    transition: opacity .3s;
  }
  .category.hidden{ display:none; }
  .category + .category{
    border-top:1px dashed var(--border);
    margin-top:2px;
  }
  .cat-header{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:8px;
    cursor:default;
    user-select:none;
  }
  .cat-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:.68rem;
    letter-spacing:.22em;
    text-transform:uppercase;
    color: var(--gold);
    display:flex;
    align-items:center;
    gap:10px;
    flex:1;
    transition: color .2s;
  }
  .cat-label::after{
    content:""; flex:1; height:1px; background:var(--border);
  }

  .cat-body{
    transition: max-height .5s ease, opacity .4s ease;
    overflow: hidden;
    max-height: none !important;
  }
  .cat-body.closed{
    max-height: 0 !important;
    opacity: 0;
    padding-top: 0;
    overflow: hidden;
  }

  .age-warning{
    background: var(--warning-bg);
    border-left: 4px solid var(--warning-border);
    padding: 8px 14px;
    margin: 4px 0 12px;
    border-radius: 6px;
    font-size: .78rem;
    color: var(--warning-text);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .age-warning .icon{ font-size:1.1rem; }

  .task{
    display:flex;
    align-items:center;
    gap:14px;
    padding:7px 2px;
    cursor:pointer;
    user-select:none;
    transition: opacity .2s;
  }
  .task.disabled{ opacity:.4; pointer-events:none; }
  .task:hover .label{ color: var(--stamp-dark); }

  .stampbox{
    position:relative;
    width:34px; height:34px;
    flex:0 0 34px;
    border-radius:50%;
    border:1.6px solid var(--text-secondary);
    display:flex; align-items:center; justify-content:center;
    transition:border-color .2s;
  }
  .task.done .stampbox{ border-color:var(--stamp); }

  .stampmark{
    position:absolute; inset:-6px;
    border-radius:50%;
    border:2px solid var(--stamp);
    display:flex; align-items:center; justify-content:center;
    opacity:0;
    transform:scale(1.6) rotate(-18deg);
    transition:opacity .18s ease, transform .28s cubic-bezier(.2,1.4,.4,1);
    color:var(--stamp);
    background: var(--stamp-bg);
  }
  .stampmark svg{ width:20px; height:20px; }
  .task.done .stampmark{ opacity:1; transform:scale(1) rotate(-10deg); }

  .label{
    font-size:.98rem;
    line-height:1.35;
    color: var(--text);
    transition:color .2s;
    flex:1;
  }
  .task.done .label{
    color: var(--text-secondary);
    text-decoration:line-through;
    text-decoration-color:var(--stamp);
    text-decoration-thickness:1.5px;
  }

  .task-date{
    font-size:.7rem;
    color: var(--text-secondary);
    background: var(--input-bg);
    border:1px solid var(--input-border);
    border-radius:999px;
    padding:2px 10px;
    font-family:'IBM Plex Mono', monospace;
    cursor:pointer;
    flex:0 0 auto;
    min-width:90px;
    text-align:center;
    transition: background .2s;
  }
  .task-date:hover{ background: var(--gold); color:#1c1608; }
  .task-date input{
    background:transparent;
    border:none;
    color: var(--text);
    font-family:'IBM Plex Mono', monospace;
    font-size:.7rem;
    width:100%;
    text-align:center;
    cursor:pointer;
  }
  .task-date input:focus{ outline:none; }

  .import-area{
    margin-top:12px;
    display:flex;
    flex-direction:column;
    gap:8px;
    width:100%;
  }
  .import-area .row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    align-items:center;
  }
  .import-area input[type="file"]{ display:none; }
  .import-area label{
    font-family:'IBM Plex Mono', monospace;
    font-size:.68rem;
    color: var(--text-secondary);
    background:var(--input-bg);
    border:1px solid var(--border);
    border-radius:999px;
    padding:4px 14px;
    cursor:pointer;
    transition: border .2s, color .2s;
  }
  .import-area label:hover{ border-color:var(--gold); color:var(--gold); }
  .import-area .export-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:.68rem;
    color: var(--text-secondary);
    background:var(--input-bg);
    border:1px solid var(--border);
    border-radius:999px;
    padding:4px 14px;
    cursor:pointer;
    letter-spacing:.03em;
    transition: border .2s, color .2s;
  }
  .import-area .export-btn:hover{ border-color:var(--gold); color:var(--gold); }

  .cat-toggle-checkbox{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .cat-toggle-checkbox input[type="checkbox"]{
    width:16px;
    height:16px;
    accent-color: var(--gold);
    cursor:pointer;
  }
  .cat-toggle-checkbox label{
    font-size:.68rem;
    color: var(--text-secondary);
    cursor:pointer;
    font-family:'IBM Plex Mono', monospace;
    letter-spacing:.05em;
  }

  footer{
    text-align:center;
    margin-top:30px;
    font-size:.72rem;
    color: var(--text-secondary);
    line-height:1.6;
  }

  .offline-badge{
    display:inline-block;
    background: var(--stamp);
    color:#fff;
    font-size:.6rem;
    padding:2px 10px;
    border-radius:999px;
    letter-spacing:.1em;
    margin-left:8px;
  }

  @media (max-width:600px){
    .category{ padding:12px 14px 2px; }
    .task{ gap:10px; }
    .badge .bar{ width:80px; }
    .settings-panel{ grid-template-columns:1fr; max-height:400px; }
    .task-date{ min-width:70px; font-size:.65rem; }
    .page{ max-height: 90vh; min-height: 400px; }
    .import-area .row{ flex-direction:column; align-items:stretch; }
    .import-area .row label, .import-area .row button{ text-align:center; }
  }
  @media (prefers-reduced-motion: reduce){
    .stampmark{ transition:none; }
    .cat-body{ transition:none; }
    .slider{ transition:none; }
    .slider::before{ transition:none; }
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">

  <div class="cover">
    <p class="eyebrow" data-i18n="eyebrow">ЛИЧНЫЙ СПИСОК ДОСТИЖЕНИЙ</p>
    <h1 data-i18n="title">Паспорт жизни <span id="versionBadge">V7</span></h1>
    <p class="sub" data-i18n="subtitle">Отмечайте то, что уже случилось. Настраивайте под себя.</p>
  </div>

  <div class="top-bar">
    <div class="controls">
      <div class="pillgroup" id="langGroup">
        <button data-lang="ru">RU</button>
        <button data-lang="en">EN</button>
      </div>
      <select class="religion" id="religionSelect"></select>
      <select class="gender" id="genderSelect"></select>
      <select class="age" id="ageSelect"></select>
      <button class="settings-toggle" id="settingsToggle">⚙️</button>
    </div>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <label>
      <span data-i18n="theme">Тема</span>
      <select id="themeSelect">
        <option value="light" data-i18n="themeLight">☀️ Светлая</option>
        <option value="dark" data-i18n="themeDark">🌙 Тёмная</option>
      </select>
    </label>
    <label>
      <span data-i18n="screenSize">Размер экрана</span>
      <select id="screenSizeSelect">
        <option value="phone" data-i18n="sizePhone">📱 Телефон</option>
        <option value="tablet" data-i18n="sizeTablet">📟 Планшет</option>
        <option value="computer" selected data-i18n="sizeComputer">💻 Компьютер</option>
        <option value="tv" data-i18n="sizeTV">📺 Телевизор</option>
        <option value="car" data-i18n="sizeCar">🚗 Авто</option>
      </select>
    </label>
    <label>
      <span data-i18n="offlineMode">Офлайн-режим</span>
      <div class="switch">
        <input type="checkbox" id="offlineToggle">
        <span class="slider"></span>
      </div>
    </label>
    <div class="import-area">
      <div class="row"><span data-i18n="importExport">📦 Импорт / Экспорт</span></div>
      <div class="row">
        <span style="font-size:.7rem;opacity:.6;" data-i18n="importLabel">📥 Импорт</span>
        <label for="importFileJSON" data-i18n="json">📄 JSON</label>
        <input type="file" id="importFileJSON" accept=".json">
        <label for="importFileCSV" data-i18n="csv">📊 CSV</label>
        <input type="file" id="importFileCSV" accept=".csv">
        <label for="importFilePDF" data-i18n="pdf">📄 PDF</label>
        <input type="file" id="importFilePDF" accept=".pdf">
      </div>
      <div class="row">
        <span style="font-size:.7rem;opacity:.6;" data-i18n="exportLabel">📤 Экспорт</span>
        <button class="export-btn" id="exportJSON" data-i18n="json">📄 JSON</button>
        <button class="export-btn" id="exportCSV" data-i18n="csv">📊 CSV</button>
        <button class="export-btn" id="exportPDF" data-i18n="pdf">📄 PDF</button>
      </div>
    </div>
    <div style="grid-column:1/-1; border-top:1px solid var(--border); padding-top:12px; margin-top:4px;">
      <div style="font-size:.7rem; opacity:.6; margin-bottom:8px;" data-i18n="categoryManage">📂 Управление категориями</div>
      <div id="categoryToggles" style="display:grid; grid-template-columns:1fr 1fr; gap:4px 16px;"></div>
    </div>
  </div>

  <p class="note" data-i18n="religionNote">Фильтры скрывают пункты с пищевыми ограничениями. Общий ориентир.</p>

  <div class="badge-row">
    <div class="badge">
      <span class="count" id="countText">0 / 0</span>
      <span class="bar"><span id="barFill"></span></span>
      <button class="reset" id="resetBtn" data-i18n="reset">СБРОС</button>
    </div>
  </div>

  <div class="page" id="page"></div>

  <footer>
    <span data-i18n="footer">Данные сохраняются в localStorage.</span>
    <span id="offlineStatus"></span>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
(function(){
  // ===== STRINGS =====
  const STR = {
    ru: {
      eyebrow: "ЛИЧНЫЙ СПИСОК ДОСТИЖЕНИЙ",
      title: "Паспорт жизни",
      subtitle: "Отмечайте то, что уже случилось. Настраивайте под себя.",
      religionNote: "Фильтры скрывают пункты с пищевыми ограничениями. Общий ориентир.",
      reset: "СБРОС",
      footer: "Данные сохраняются в localStorage.",
      resetConfirm: "Сбросить весь прогресс? Это нельзя отменить.",
      theme: "Тема",
      themeLight: "☀️ Светлая",
      themeDark: "🌙 Тёмная",
      screenSize: "Размер экрана",
      sizePhone: "📱 Телефон",
      sizeTablet: "📟 Планшет",
      sizeComputer: "💻 Компьютер",
      sizeTV: "📺 Телевизор",
      sizeCar: "🚗 Авто",
      offlineMode: "Офлайн-режим",
      importExport: "Импорт / Экспорт",
      importLabel: "Импорт",
      exportLabel: "Экспорт",
      json: "JSON",
      csv: "CSV",
      pdf: "PDF",
      categoryManage: "📂 Управление категориями",
      ageWarning: "Некоторые пункты в этой категории доступны только для пользователей старше 18 лет.",

    dep("e1py","entertainment","  Undertale","  Undertale", "e1"),
    dep("e1pz","entertainment","  Deltarune","  Deltarune", "e1"),
    dep("e1qa","entertainment","  Five Nights at Freddy's","  Five Nights at Freddy's", "e1"),
    dep("e1qb","entertainment","  Five Nights at Freddy's 2","  Five Nights at Freddy's 2", "e1"),

    dep("e1qd","entertainment","  Five Nights at Freddy's 4","  Five Nights at Freddy's 4", "e1"),
    dep("e1qe","entertainment","  Five Nights at Freddy's: Sister Location","  Five Nights at Freddy's: Sister Location", "e1"),
    dep("e1qf","entertainment","  Freddy Fazbear's Pizzeria Simulator","  Freddy Fazbear's Pizzeria Simulator", "e1"),
    dep("e1qg","entertainment","  Ultimate Custom Night","  Ultimate Custom Night", "e1"),
    dep("e1qh","entertainment","  Five Nights at Freddy's: Help Wanted","  Five Nights at Freddy's: Help Wanted", "e1"),
    dep("e1qi","entertainment","  Five Nights at Freddy's: Security Breach","  Five Nights at Freddy's: Security Breach", "e1"),
    dep("e1qj","entertainment","  Five Nights at Freddy's: Help Wanted 2","  Five Nights at Freddy's: Help Wanted 2", "e1"),
    dep("e1qk","entertainment","  Five Nights at Freddy's: Secret of the Mimic","  Five Nights at Freddy's: Secret of the Mimic", "e1"),
    dep("e1ql","entertainment","  FNaF World","  FNaF World", "e1"),
    dep("e1qm","entertainment","  Bendy and the Ink Machine","  Bendy and the Ink Machine", "e1"),
    dep("e1qn","entertainment","  Bendy and the Dark Revival","  Bendy and the Dark Revival", "e1"),
    dep("e1qo","entertainment","  Hello Neighbor","  Hello Neighbor", "e1"),
    dep("e1qp","entertainment","  Hello Neighbor 2","  Hello Neighbor 2", "e1"),
    dep("e1qq","entertainment","  Hello Neighbor 3","  Hello Neighbor 3", "e1"),
    dep("e1qr","entertainment","  Baldi's Basics in Education and Learning","  Baldi's Basics in Education and Learning", "e1"),
    dep("e2","entertainment","Был в аквапарке","Been to a water park"),
    dep("e3","entertainment","Был в парке развлечений","Been to an amusement park"),
    dep("e4","entertainment","Был в Disneyland","Been to Disneyland"),
    dep("e5","entertainment","Был в батутном центре","Been to a trampoline park")
  ];

  const CAT_ORDER = ["milestones","family","health","internet","tech","nature","extreme","education","career","art","psychology","politics","charity","legal","pets","purchases","finance","home","travel","transport","languages","food","drinks","water","adult","sports","events","entertainment"];
  const RELIGION_HIDE = { none:[], christianity:[], islam:["pork"], judaism:["pork","shellfish","horse"], hinduism:["beef"], buddhism:["meat"] };
  const SCREEN_SIZES = ["phone","tablet","computer","tv","car"];

  // ===== STATE =====
  const STORAGE_KEY = "life-passport-state-v7";
  let state = {
    lang:"ru",
    religion:"none",
    gender:"male",
    age:"under18",
    theme:"light",
    screenSize:"computer",
    offline:false,
    done:{},
    dates:{},
    catHidden:{}
  };
  try{
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if(saved) state = Object.assign(state, saved);
  }catch(e){}

  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  // ===== DOM refs =====
  const wrapEl = document.getElementById("wrap");
  const pageEl = document.getElementById("page");
  const countEl = document.getElementById("countText");
  const barEl = document.getElementById("barFill");
  const religionSelect = document.getElementById("religionSelect");
  const genderSelect = document.getElementById("genderSelect");
  const ageSelect = document.getElementById("ageSelect");
  const themeSelect = document.getElementById("themeSelect");
  const screenSizeSelect = document.getElementById("screenSizeSelect");
  const offlineToggle = document.getElementById("offlineToggle");
  const settingsPanel = document.getElementById("settingsPanel");
  const settingsToggle = document.getElementById("settingsToggle");
  const categoryToggles = document.getElementById("categoryToggles");

  // ===== Helpers =====
  function visibleTasks(){
    const hide = RELIGION_HIDE[state.religion] || [];
    return TASKS.filter(t=>{
      if(t.langOnly && t.langOnly !== state.lang) return false;
      if(t.tags && t.tags.some(tag => hide.includes(tag))) return false;
      if(t.dependsOn && !state.done[t.dependsOn]) return false;
      if(t.adultOnly && state.age === "under18") return false;
      if(t.genderOnly && t.genderOnly !== state.gender) return false;
      return true;
    });
  }

  function getPronoun(text){
    if(state.gender === "female" && state.lang === "ru"){
      const replacements = {
        'получил':'получила','купил':'купила','завёл':'завела','сменил':'сменила',
        'переехал':'переехала','стал':'стала','сыграл':'сыграла','развёлся':'развелась',
        'вышел':'вышла','ездил':'ездила','летал':'летала','плавал':'плавала',
        'выучил':'выучила','пробовал':'пробовала','ел':'ела','ловил':'ловила',
        'играл':'играла','бегал':'бегала','прыгал':'прыгала','нырял':'ныряла',
        'катался':'каталась','курил':'курила','пил':'пила','был':'была',
        'мастурбировал':'мастурбировала','целовался':'целовалась','занимался':'занималась',
        'сидел':'сидела','получал':'получала','закончил':'закончила','отслужил':'отслужила',
        'смотрел':'смотрела','исключён':'исключена','усыновил':'усыновила',
        'воспитывал':'воспитывала','создал':'создала','сделал':'сделала',
        'сажал':'сажала','ночевал':'ночевала','спускался':'спускалась','кормил':'кормила',
        'прошёл':'прошла','защитил':'защитила','написал':'написала','участвовал':'участвовала',
        'победил':'победила','работал':'работала','отремонтировал':'отремонтировала',
        'рисовал':'рисовала','выступал':'выступала','снимал':'снимала','монтировал':'монтировала',
        'писал':'писала','простил':'простила','избавился':'избавилась','попал':'попала',
        'присутствовал':'присутствовала','перерезал':'перерезала','выбирал':'выбирала',
        'крестил':'крестила','содержал':'содержала','ухаживал':'ухаживала','потерял':'потеряла',
        'организовал':'организовала','собрал':'собрала','украсил':'украсила','приготовил':'приготовила',
        'испёк':'испекла','сварил':'сварила','жарил':'жарила','голосовал':'голосовала',
        'побывал':'побывала','пересёк':'пересекла','путешествовал':'путешествовала'
      };
      let result = text;
      for(const [key, val] of Object.entries(replacements)){
        result = result.replace(new RegExp(key, 'gi'), val);
      }
      return result;
    }
    return text;
  }

  // ===== Render =====
  function renderReligionOptions(){
    const t = STR[state.lang].religions;
    religionSelect.innerHTML = "";
    ["none","christianity","islam","buddhism","hinduism","judaism"].forEach(key=>{
      const opt = document.createElement("option");
      opt.value = key;
      opt.textContent = t[key] || key;
      if(key === state.religion) opt.selected = true;
      religionSelect.appendChild(opt);
    });
  }

  function renderGenderOptions(){
    const t = STR[state.lang].genders;
    genderSelect.innerHTML = "";
    ["male","female"].forEach(key=>{
      const opt = document.createElement("option");
      opt.value = key;
      opt.textContent = t[key] || key;
      if(key === state.gender) opt.selected = true;
      genderSelect.appendChild(opt);
    });
  }

  function renderAgeOptions(){
    const t = STR[state.lang].ages;
    ageSelect.innerHTML = "";
    ["under18","over18"].forEach(key=>{
      const opt = document.createElement("option");
      opt.value = key;
      opt.textContent = t[key] || key;
      if(key === state.age) opt.selected = true;
      ageSelect.appendChild(opt);
    });
  }

  function renderStaticText(){
    document.documentElement.lang = state.lang;
    const t = STR[state.lang];
    document.querySelectorAll("[data-i18n]").forEach(el=>{
      const key = el.getAttribute("data-i18n");
      if(t[key] !== undefined) el.textContent = t[key];
    });
    // Update theme and screen size options dynamically
    const themeOpts = themeSelect.querySelectorAll('option');
    themeOpts.forEach(opt => {
      const key = opt.getAttribute('data-i18n');
      if(key && t[key]) opt.textContent = t[key];
    });
    const sizeOpts = screenSizeSelect.querySelectorAll('option');
    sizeOpts.forEach(opt => {
      const key = opt.getAttribute('data-i18n');
      if(key && t[key]) opt.textContent = t[key];
    });
    document.querySelectorAll("#langGroup button").forEach(b=>{
      b.classList.toggle("active", b.dataset.lang === state.lang);
    });
    const badge = document.getElementById("versionBadge");
    if(badge) badge.textContent = "V7";
  }

  const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 L9.5 18 L20 6"/></svg>';

  function renderCategoryToggles(){
    categoryToggles.innerHTML = "";
    const t = STR[state.lang].cats;
    const showLabel = STR[state.lang].show || "показать";
    CAT_ORDER.forEach(catKey=>{
      const name = t[catKey] || catKey;
      const div = document.createElement("div");
      div.className = "cat-toggle-row";
      div.innerHTML = `
        <span class="cat-name">${name}</span>
        <div class="cat-toggle-checkbox">
          <input type="checkbox" id="cat_${catKey}" ${state.catHidden[catKey] ? '' : 'checked'}>
          <label for="cat_${catKey}">${showLabel}</label>
        </div>
      `;
      const checkbox = div.querySelector('input');
      checkbox.addEventListener('change', function(){
        if(this.checked){
          delete state.catHidden[catKey];
        } else {
          state.catHidden[catKey] = true;
        }
        save();
        renderAll();
      });
      categoryToggles.appendChild(div);
    });
  }

  function renderTasks(){
    const tasks = visibleTasks();
    pageEl.innerHTML = "";

    CAT_ORDER.forEach(catKey=>{
      const items = tasks.filter(x=>x.cat===catKey);
      if(items.length === 0) return;
      if(state.catHidden[catKey]) return;

      const catEl = document.createElement("div");
      catEl.className = "category";

      const header = document.createElement("div");
      header.className = "cat-header";
      const label = document.createElement("div");
      label.className = "cat-label";
      const catName = STR[state.lang].cats[catKey] || catKey;
      label.textContent = catName;
      header.appendChild(label);
      catEl.appendChild(header);

      if(catKey === "adult" && state.age === "under18"){
        const warning = document.createElement("div");
        warning.className = "age-warning";
        warning.innerHTML = `<span class="icon">⚠️</span> ${STR[state.lang].ageWarning || "Some items in this category are only available for users over 18."}`;
        catEl.appendChild(warning);
      }

      const body = document.createElement("div");
      body.className = "cat-body";
      body.style.maxHeight = "none";

      items.forEach(item=>{
        const row = document.createElement("div");
        const isDone = !!state.done[item.id];
        const isDisabled = item.dependsOn && !state.done[item.dependsOn];
        const isAdultHidden = item.adultOnly && state.age === "under18";
        row.className = "task" + (isDone ? " done" : "") + (isDisabled || isAdultHidden ? " disabled" : "");
        row.setAttribute("role","checkbox");
        row.setAttribute("aria-checked", isDone ? "true" : "false");
        row.tabIndex = 0;

        const box = document.createElement("div");
        box.className = "stampbox";
        const mark = document.createElement("div");
        mark.className = "stampmark";
        mark.innerHTML = CHECK_SVG;
        box.appendChild(mark);

        const label2 = document.createElement("div");
        label2.className = "label";
        let text = item[state.lang] || item.ru || item.en || "";
        if(state.gender === "female" && state.lang === "ru") text = getPronoun(text);
        label2.textContent = text;

        const dateWrap = document.createElement("div");
        dateWrap.className = "task-date";
        const dateInput = document.createElement("input");
        dateInput.type = "date";
        dateInput.value = state.dates[item.id] || "";
        dateInput.addEventListener("change", (e)=>{
          e.stopPropagation();
          if(e.target.value) state.dates[item.id] = e.target.value;
          else delete state.dates[item.id];
          save();
        });
        dateInput.addEventListener("click", e=>e.stopPropagation());
        dateWrap.appendChild(dateInput);

        row.appendChild(box);
        row.appendChild(label2);
        row.appendChild(dateWrap);

        function toggle(){
          if(isDisabled || isAdultHidden) return;
          state.done[item.id] = !state.done[item.id];
          if(!state.done[item.id]) delete state.dates[item.id];
          save();
          renderAll();
        }
        row.addEventListener("click", toggle);
        row.addEventListener("keydown", e=>{
          if(e.key === " " || e.key === "Enter"){ e.preventDefault(); toggle(); }
        });

        body.appendChild(row);
      });

      catEl.appendChild(body);
      pageEl.appendChild(catEl);
    });
  }

  function updateProgress(){
    const tasks = visibleTasks();
    const total = tasks.length;
    const done = tasks.filter(x=>state.done[x.id]).length;
    countEl.textContent = done + " / " + total;
    barEl.style.width = (total ? (done/total*100) : 0) + "%";
  }

  function applyTheme(){
    document.documentElement.setAttribute("data-theme", state.theme);
    themeSelect.value = state.theme;
  }

  function applyScreenSize(){
    wrapEl.className = "wrap";
    if(state.screenSize && state.screenSize !== "computer"){
      wrapEl.classList.add(state.screenSize);
    }
    screenSizeSelect.value = state.screenSize;
  }

  function applyOffline(){
    offlineToggle.checked = state.offline;
    const status = document.getElementById("offlineStatus");
    if(state.offline){
      status.innerHTML = ' <span class="offline-badge">📡 OFFLINE</span>';
      if('serviceWorker' in navigator){
        navigator.serviceWorker.register('sw.js').catch(()=>{});
      }
    } else {
      status.innerHTML = '';
    }
  }

  function renderAll(){
    renderStaticText();
    renderReligionOptions();
    renderGenderOptions();
    renderAgeOptions();
    renderCategoryToggles();
    renderTasks();
    updateProgress();
    applyTheme();
    applyScreenSize();
    applyOffline();
    if(settingsPanel.classList.contains("open")){
      settingsPanel.style.display = "grid";
    } else {
      settingsPanel.style.display = "none";
    }
  }

  // ===== Settings toggle =====
  settingsToggle.addEventListener("click", ()=>{
    settingsPanel.classList.toggle("open");
    settingsPanel.style.display = settingsPanel.classList.contains("open") ? "grid" : "none";
  });

  // ===== Settings events =====
  themeSelect.addEventListener("change", ()=>{
    state.theme = themeSelect.value;
    save();
    applyTheme();
  });

  screenSizeSelect.addEventListener("change", ()=>{
    state.screenSize = screenSizeSelect.value;
    save();
    applyScreenSize();
  });

  offlineToggle.addEventListener("change", ()=>{
    state.offline = offlineToggle.checked;
    save();
    applyOffline();
  });

  document.querySelectorAll("#langGroup button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.lang = btn.dataset.lang;
      save();
      renderAll();
    });
  });

  religionSelect.addEventListener("change", ()=>{
    state.religion = religionSelect.value;
    save();
    renderAll();
  });

  genderSelect.addEventListener("change", ()=>{
    state.gender = genderSelect.value;
    save();
    renderAll();
  });

  ageSelect.addEventListener("change", ()=>{
    state.age = ageSelect.value;
    save();
    renderAll();
  });

  document.getElementById("resetBtn").addEventListener("click", ()=>{
    if(confirm(STR[state.lang].resetConfirm)){
      state.done = {};
      state.dates = {};
      save();
      renderAll();
    }
  });

  // ===== Export / Import =====
  function exportData(type){
    const data = {
      version: "V7",
      exportDate: new Date().toISOString(),
      state: state,
      tasks: TASKS
    };
    const str = JSON.stringify(data, null, 2);

    if(type === 'json'){
      const blob = new Blob([str], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `life-passport-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    } else if(type === 'csv'){
      let csv = "ID,Category,Task,Done,Date\n";
      TASKS.forEach(t=>{
        const done = state.done[t.id] ? "Yes" : "No";
        const date = state.dates[t.id] || "";
        const cat = STR[state.lang].cats[t.cat] || t.cat;
        const text = t[state.lang] || t.ru || t.en || "";
        csv += `"${t.id}","${cat}","${text}",${done},"${date}"\n`;
      });
      const blob = new Blob([csv], {type:'text/csv'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `life-passport-${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    } else if(type === 'pdf'){
      const el = document.createElement('div');
      el.innerHTML = `
        <h1 style="font-family:serif;">Life Passport</h1>
        <p>${new Date().toLocaleDateString()}</p>
        <table style="width:100%;border-collapse:collapse;">
          <tr><th style="border:1px solid #ccc;padding:6px;">Task</th><th style="border:1px solid #ccc;padding:6px;">Done</th><th style="border:1px solid #ccc;padding:6px;">Date</th></tr>
          ${TASKS.map(t=>{
            const done = state.done[t.id] ? "✅" : "⬜";
            const date = state.dates[t.id] || "";
            const text = t[state.lang] || t.ru || t.en || "";
            return `<tr><td style="border:1px solid #ccc;padding:6px;">${text}</td><td style="border:1px solid #ccc;padding:6px;text-align:center;">${done}</td><td style="border:1px solid #ccc;padding:6px;">${date}</td></tr>`;
          }).join('')}
        </table>
      `;
      el.style.padding = '20px';
      el.style.fontFamily = 'sans-serif';
      html2pdf().set({ margin: 10, filename: `life-passport-${new Date().toISOString().slice(0,10)}.pdf` }).from(el).save();
    }
  }

  document.getElementById("exportJSON").addEventListener("click", ()=>exportData('json'));
  document.getElementById("exportCSV").addEventListener("click", ()=>exportData('csv'));
  document.getElementById("exportPDF").addEventListener("click", ()=>exportData('pdf'));

  // ===== Import =====
  function handleImport(file, format){
    const reader = new FileReader();
    reader.onload = function(ev){
      try{
        let data;
        if(format === 'json'){
          data = JSON.parse(ev.target.result);
        } else if(format === 'csv'){
          const lines = ev.target.result.split('\n');
          const headers = lines[0].split(',');
          const parsed = [];
          for(let i=1; i<lines.length; i++){
            if(!lines[i].trim()) continue;
            const values = lines[i].split(',');
            const obj = {};
            headers.forEach((h, idx) => {
              const key = h.replace(/"/g, '').trim();
              let val = values[idx] || '';
              val = val.replace(/"/g, '').trim();
              obj[key] = val;
            });
            parsed.push(obj);
          }
          data = { state: { done: {}, dates: {} } };
          parsed.forEach(row => {
            if(row.ID && row.Done === 'Yes'){
              data.state.done[row.ID] = true;
              if(row.Date) data.state.dates[row.ID] = row.Date;
            }
          });
        } else if(format === 'pdf'){
          alert("PDF import is not supported. Please use JSON or CSV format.");
          return;
        }
        if(data && data.state){
          state = Object.assign(state, data.state);
          save();
          renderAll();
          alert("Import successful!");
        } else if(data && data.done){
          state.done = data.done || {};
          state.dates = data.dates || {};
          save();
          renderAll();
          alert("Import successful!");
        } else {
          alert("Invalid file format");
        }
      }catch(err){
        alert("Error parsing file: " + err.message);
      }
    };
    reader.readAsText(file);
  }

  document.getElementById("importFileJSON").addEventListener("change", function(e){
    if(this.files[0]) handleImport(this.files[0], 'json');
    this.value = '';
  });

  document.getElementById("importFileCSV").addEventListener("change", function(e){
    if(this.files[0]) handleImport(this.files[0], 'csv');
    this.value = '';
  });

  document.getElementById("importFilePDF").addEventListener("change", function(e){
    if(this.files[0]) handleImport(this.files[0], 'pdf');
    this.value = '';
  });

  // ===== Init =====
  renderAll();

})();
</script>
